[package]
name = "takt-rs"
version = "0.0.1"
edition = "2021"
description = "A lightweight Rust hybrid agent orchestrator"
publish = false

[[bin]]
name = "takt"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
